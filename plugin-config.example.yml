# Match these product ids in ZedxWebStore config.yml
# Website does NOT run Minecraft commands — your plugin does.

secret: "same value as ZEDX_STORE_SECRET on the website"
port: 28787

products:
  rank-vip:
    commands:
      - "lp user {player} parent add vip"
  rank-mvp:
    commands:
      - "lp user {player} parent add mvp"
  rank-zedx:
    commands:
      - "lp user {player} parent add zedx"
  rank-zedxplus:
    commands:
      - "lp user {player} parent add zedxplus"
  rank-knight:
    commands:
      - "lp user {player} parent add knight"
  rank-vip-1mo:
    commands:
      - "lp user {player} parent addtemp vip 30d"
  rank-mvp-1mo:
    commands:
      - "lp user {player} parent addtemp mvp 30d"
  rank-zedx-1mo:
    commands:
      - "lp user {player} parent addtemp zedx 30d"
  rank-zedxplus-1mo:
    commands:
      - "lp user {player} parent addtemp zedxplus 30d"
  rank-knight-1mo:
    commands:
      - "lp user {player} parent addtemp knight 30d"
  rank-vip-remove:
    commands:
      - "lp user {player} parent remove vip"
  rank-mvp-remove:
    commands:
      - "lp user {player} parent remove mvp"
  rank-zedx-remove:
    commands:
      - "lp user {player} parent remove zedx"
  rank-zedxplus-remove:
    commands:
      - "lp user {player} parent remove zedxplus"
  rank-knight-remove:
    commands:
      - "lp user {player} parent remove knight"
  key-common:
    commands:
      - "dc givekey {player} common-crate {quantity}"
  key-epic:
    commands:
      - "dc givekey {player} epic-crate {quantity}"
  key-rare:
    commands:
      - "dc givekey {player} rare-crate {quantity}"
  key-legendary:
    commands:
      - "dc givekey {player} legendary-crate {quantity}"
  key-shadow:
    commands:
      - "dc givekey {player} shadow-crate {quantity}"
  # Old store/webhook ids still deliver Shadow keys
  key-amethyst:
    commands:
      - "dc givekey {player} shadow-crate {quantity}"
  key-zedxplus:
    commands:
      - "dc givekey {player} zedxplus-crate {quantity}"
